<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OneDesk — Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      cursor: default;
    }

    /* ─── Stream Container ─────────────────────────────────────────── */
    #streamContainer {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* ─── Connection Overlay ───────────────────────────────────────── */
    #connectingOverlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #0a0a0f, #1a1a2e);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #connectingOverlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .connect-spinner {
      width: 48px; height: 48px;
      border: 3px solid rgba(255,255,255,0.08);
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .connect-device-name {
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .connect-text {
      color: rgba(255,255,255,0.5);
      font-size: 14px;
    }

    /* ─── Top Control Bar ──────────────────────────────────────────── */
    #controlBar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 48px;
      background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 80px 0 20px;
      opacity: 0;
      transition: opacity 0.25s ease;
      z-index: 50;
      -webkit-app-region: drag;
    }
    #streamContainer:hover #controlBar { opacity: 1; }

    .control-left {
      display: flex;
      align-items: center;
      gap: 12px;
      -webkit-app-region: no-drag;
    }
    .control-device {
      color: rgba(255,255,255,0.8);
      font-size: 13px;
      font-weight: 600;
    }
    .control-quality {
      color: rgba(255,255,255,0.4);
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(255,255,255,0.1);
    }

    .control-right {
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .ctrl-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.7);
      width: 32px; height: 32px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .ctrl-btn:hover {
      background: rgba(255,255,255,0.2);
      color: #fff;
    }
    .ctrl-btn.active {
      background: rgba(102,126,234,0.3);
      border-color: rgba(102,126,234,0.5);
      color: #667eea;
    }

    /* ─── Quality Selector ─────────────────────────────────────────── */
    #qualityMenu {
      position: absolute;
      top: 52px;
      right: 20px;
      background: rgba(30,30,40,0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 6px;
      z-index: 60;
      display: none;
      min-width: 160px;
    }
    #qualityMenu.visible { display: block; }

    .quality-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-radius: 6px;
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .quality-option:hover { background: rgba(255,255,255,0.08); }
    .quality-option.active {
      color: #667eea;
      font-weight: 600;
    }
    .quality-option .check { opacity: 0; }
    .quality-option.active .check { opacity: 1; }

    /* ─── Stats HUD ────────────────────────────────────────────────── */
    #statsHUD {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 10px 14px;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      z-index: 50;
      display: none;
      line-height: 1.6;
    }
    #statsHUD.visible { display: block; }
    .stat-row { display: flex; gap: 16px; }
    .stat-label { color: rgba(255,255,255,0.3); }
    .stat-value { color: rgba(255,255,255,0.7); }
    .stat-good { color: #34c759; }
    .stat-warn { color: #ff9f0a; }
    .stat-bad { color: #ff453a; }

    /* ─── Clipboard Toast ──────────────────────────────────────────── */
    #clipboardToast {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(30,30,40,0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(102,126,234,0.3);
      border-radius: 10px;
      padding: 10px 16px;
      color: rgba(255,255,255,0.8);
      font-size: 12px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
      transform: translateY(80px);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #clipboardToast.show { transform: translateY(0); }

    /* ─── File Drop Zone ───────────────────────────────────────────── */
    #fileDropZone {
      position: absolute;
      inset: 0;
      background: rgba(102,126,234,0.15);
      border: 3px dashed rgba(102,126,234,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 80;
    }
    #fileDropZone.active { display: flex; }
    .drop-text {
      color: rgba(255,255,255,0.8);
      font-size: 18px;
      font-weight: 600;
    }

    /* ─── File Progress ────────────────────────────────────────────── */
    #fileProgress {
      position: absolute;
      top: 56px;
      right: 16px;
      background: rgba(30,30,40,0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 12px 16px;
      min-width: 220px;
      z-index: 50;
      display: none;
    }
    #fileProgress.visible { display: block; }
    .file-progress-name {
      color: rgba(255,255,255,0.8);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .file-progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
    }
    .file-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      border-radius: 2px;
      transition: width 0.3s ease;
      width: 0%;
    }
    .file-progress-pct {
      color: rgba(255,255,255,0.4);
      font-size: 11px;
      margin-top: 4px;
      text-align: right;
    }
  </style>
</head>
<body>
  <div id="streamContainer">
    <!-- Connecting overlay -->
    <div id="connectingOverlay">
      <div class="connect-spinner"></div>
      <div class="connect-device-name" id="targetName">Connecting...</div>
      <div class="connect-text">Establishing secure connection</div>
    </div>

    <!-- Remote video -->
    <video id="remoteVideo" autoplay playsinline></video>

    <!-- Control bar -->
    <div id="controlBar">
      <div class="control-left">
        <span class="control-device" id="controlDevice">—</span>
        <span class="control-quality" id="controlQuality">Auto</span>
      </div>
      <div class="control-right">
        <button class="ctrl-btn" id="btnStats" title="Toggle Stats" onclick="toggleStats()">📊</button>
        <button class="ctrl-btn" id="btnClipboard" title="Clipboard Sync Active">📋</button>
        <button class="ctrl-btn" id="btnAudio" title="Toggle Audio" onclick="toggleAudio()">🔇</button>
        <button class="ctrl-btn" id="btnQuality" title="Quality" onclick="toggleQualityMenu()">⚙️</button>
        <button class="ctrl-btn" id="btnFullscreen" title="Fullscreen" onclick="toggleFullscreen()">⛶</button>
        <button class="ctrl-btn" title="Disconnect" onclick="disconnect()" style="color:#ff453a">✕</button>
      </div>
    </div>

    <!-- Quality menu -->
    <div id="qualityMenu">
      <div class="quality-option" data-preset="auto" onclick="setQuality('auto')">
        <span>Auto</span><span class="check">✓</span>
      </div>
      <div class="quality-option" data-preset="high" onclick="setQuality('high')">
        <span>High (1080p)</span><span class="check">✓</span>
      </div>
      <div class="quality-option" data-preset="medium" onclick="setQuality('medium')">
        <span>Medium (720p)</span><span class="check">✓</span>
      </div>
      <div class="quality-option" data-preset="low" onclick="setQuality('low')">
        <span>Low (360p)</span><span class="check">✓</span>
      </div>
    </div>

    <!-- Stats HUD -->
    <div id="statsHUD">
      <div class="stat-row">
        <span class="stat-label">RTT</span>
        <span class="stat-value" id="statRTT">—</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">FPS</span>
        <span class="stat-value" id="statFPS">—</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Loss</span>
        <span class="stat-value" id="statLoss">—</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Quality</span>
        <span class="stat-value" id="statQuality">—</span>
      </div>
    </div>

    <!-- Clipboard toast -->
    <div id="clipboardToast">
      <span>📋</span>
      <span id="clipboardText">Clipboard synced</span>
    </div>

    <!-- File drop zone -->
    <div id="fileDropZone">
      <span class="drop-text">Drop files to transfer</span>
    </div>

    <!-- File progress -->
    <div id="fileProgress">
      <div class="file-progress-name" id="fileProgressName">—</div>
      <div class="file-progress-bar">
        <div class="file-progress-fill" id="fileProgressFill"></div>
      </div>
      <div class="file-progress-pct" id="fileProgressPct">0%</div>
    </div>
  </div>

  <script>
    let peerConnection = null;
    let inputChannel = null;
    let clipboardChannel = null;
    let fileChannel = null;
    let targetDevice = null;
    let selfId = null;
    let showStats = false;
    let currentQuality = 'auto';

    const ICE_SERVERS = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' }
    ];

    // ─── Initialize ─────────────────────────────────────────────────
    window.onedesk.onStartViewing((data) => {
      targetDevice = data.targetDevice;
      selfId = data.selfId;
      document.getElementById('targetName').textContent = targetDevice.deviceName;
      document.getElementById('controlDevice').textContent = targetDevice.deviceName;
      initiateConnection();
    });

    async function initiateConnection() {
      console.log('[Viewer] Initiating connection to', targetDevice.deviceName);

      peerConnection = new RTCPeerConnection({ iceServers: ICE_SERVERS });

      // Incoming stream
      peerConnection.ontrack = (event) => {
        console.log('[Viewer] Track received:', event.track.kind);
        const video = document.getElementById('remoteVideo');
        if (event.streams && event.streams[0]) {
          video.srcObject = event.streams[0];
          // By default, video is muted to allow autoplay in some environments
          video.muted = true;
          document.getElementById('btnAudio').textContent = '🔇';
        }
        document.getElementById('connectingOverlay').classList.add('hidden');
      };

      // ICE candidates
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          window.onedesk.sendSignal('webrtc-ice-candidate', {
            targetSocketId: targetDevice.socketId,
            candidate: event.candidate
          });
        }
      };

      // Connection state
      peerConnection.onconnectionstatechange = () => {
        const state = peerConnection.connectionState;
        console.log('[Viewer] State:', state);
        if (state === 'connected') {
          document.getElementById('connectingOverlay').classList.add('hidden');
        }
        if (state === 'failed') {
          // Attempt ICE restart
          console.log('[Viewer] Connection failed — attempting ICE restart');
          peerConnection.restartIce();
        }
      };

      // ─── Data Channels ──────────────────────────────────────────
      // Input channel
      inputChannel = peerConnection.createDataChannel('input', { ordered: true });
      inputChannel.onopen = () => {
        console.log('[Viewer] Input channel open');
        setupInputCapture();
      };

      // Clipboard channel
      clipboardChannel = peerConnection.createDataChannel('clipboard', { ordered: true });
      clipboardChannel.onopen = () => console.log('[Viewer] Clipboard channel open');
      clipboardChannel.onmessage = (msg) => {
        try {
          const data = JSON.parse(msg.data);
          window.onedesk.writeClipboardFromRemote(data);
          showClipboardToast('Clipboard received from host');
        } catch (e) {}
      };

      // File transfer channel
      fileChannel = peerConnection.createDataChannel('filetransfer', {
        ordered: true,
        maxRetransmits: 10
      });
      fileChannel.onopen = () => console.log('[Viewer] File transfer channel open');
      fileChannel.onmessage = (msg) => {
        try {
          const data = JSON.parse(msg.data);
          window.onedesk.receiveFileMessage(data);
        } catch (e) {}
      };

      // Create and send offer
      const offer = await peerConnection.createOffer({
        offerToReceiveVideo: true,
        offerToReceiveAudio: false
      });
      await peerConnection.setLocalDescription(offer);

      window.onedesk.sendSignal('webrtc-offer', {
        targetSocketId: targetDevice.socketId,
        offer: peerConnection.localDescription
      });
    }

    // ─── WebRTC Answer & ICE ────────────────────────────────────────
    window.onedesk.onWebRTCAnswer(async (data) => {
      if (peerConnection) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      }
    });

    window.onedesk.onWebRTCIceCandidate(async (data) => {
      if (peerConnection && data.candidate) {
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        } catch (e) {}
      }
    });

    // ─── Input Capture ──────────────────────────────────────────────
    function setupInputCapture() {
      const video = document.getElementById('remoteVideo');

      video.addEventListener('mousemove', throttle((e) => {
        if (!inputChannel || inputChannel.readyState !== 'open') return;
        const rect = video.getBoundingClientRect();
        sendInput({ type: 'mousemove', x: (e.clientX - rect.left) / rect.width, y: (e.clientY - rect.top) / rect.height });
      }, 16)); // ~60fps throttle

      video.addEventListener('mousedown', (e) => {
        if (!inputChannel || inputChannel.readyState !== 'open') return;
        const rect = video.getBoundingClientRect();
        sendInput({ type: 'mousedown', x: (e.clientX - rect.left) / rect.width, y: (e.clientY - rect.top) / rect.height, button: e.button });
      });

      video.addEventListener('mouseup', (e) => {
        if (!inputChannel || inputChannel.readyState !== 'open') return;
        const rect = video.getBoundingClientRect();
        sendInput({ type: 'mouseup', x: (e.clientX - rect.left) / rect.width, y: (e.clientY - rect.top) / rect.height, button: e.button });
      });

      video.addEventListener('wheel', (e) => {
        if (!inputChannel || inputChannel.readyState !== 'open') return;
        e.preventDefault();
        sendInput({ type: 'scroll', deltaX: e.deltaX, deltaY: e.deltaY });
      }, { passive: false });

      video.addEventListener('dblclick', (e) => {
        if (!inputChannel || inputChannel.readyState !== 'open') return;
        const rect = video.getBoundingClientRect();
        sendInput({ type: 'dblclick', x: (e.clientX - rect.left) / rect.width, y: (e.clientY - rect.top) / rect.height });
      });

      // Right-click context menu prevention
      video.addEventListener('contextmenu', (e) => e.preventDefault());

      document.addEventListener('keydown', (e) => {
        if (!inputChannel || inputChannel.readyState !== 'open') return;
        // Don't capture Cmd+Q, Cmd+W etc.
        if (e.metaKey && ['q', 'w'].includes(e.key.toLowerCase())) return;
        e.preventDefault();
        sendInput({
          type: 'keydown', key: e.key, code: e.code,
          shiftKey: e.shiftKey, ctrlKey: e.ctrlKey,
          altKey: e.altKey, metaKey: e.metaKey
        });
      });

      document.addEventListener('keyup', (e) => {
        if (!inputChannel || inputChannel.readyState !== 'open') return;
        e.preventDefault();
        sendInput({ type: 'keyup', key: e.key, code: e.code });
      });
    }

    function sendInput(event) {
      if (inputChannel && inputChannel.readyState === 'open') {
        inputChannel.send(JSON.stringify(event));
      }
    }

    function throttle(fn, ms) {
      let last = 0;
      return function(...args) {
        const now = Date.now();
        if (now - last >= ms) {
          last = now;
          fn.apply(this, args);
        }
      };
    }

    // ─── Clipboard Sync (Viewer → Host) ─────────────────────────────
    window.onedesk.onClipboardChanged((data) => {
      if (clipboardChannel && clipboardChannel.readyState === 'open') {
        clipboardChannel.send(JSON.stringify(data));
        showClipboardToast('Clipboard sent to host');
      }
    });

    function showClipboardToast(text) {
      const toast = document.getElementById('clipboardToast');
      document.getElementById('clipboardText').textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // ─── File Drop ──────────────────────────────────────────────────
    const container = document.getElementById('streamContainer');
    const dropZone = document.getElementById('fileDropZone');

    container.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('active');
    });

    container.addEventListener('dragleave', (e) => {
      if (!container.contains(e.relatedTarget)) {
        dropZone.classList.remove('active');
      }
    });

    container.addEventListener('drop', async (e) => {
      e.preventDefault();
      dropZone.classList.remove('active');

      if (!fileChannel || fileChannel.readyState !== 'open') {
        console.warn('[Viewer] File channel not ready');
        return;
      }

      const files = e.dataTransfer.files;
      for (const file of files) {
        await sendFile(file);
      }
    });

    async function sendFile(file) {
      const CHUNK_SIZE = 64 * 1024;
      const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
      const transferId = crypto.randomUUID();

      // Send start
      fileChannel.send(JSON.stringify({
        type: 'file-start',
        id: transferId,
        name: file.name,
        size: file.size,
        totalChunks
      }));

      // Show progress UI
      const progressEl = document.getElementById('fileProgress');
      const progressName = document.getElementById('fileProgressName');
      const progressFill = document.getElementById('fileProgressFill');
      const progressPct = document.getElementById('fileProgressPct');
      progressEl.classList.add('visible');
      progressName.textContent = file.name;

      // Read and send chunks
      const reader = file.stream().getReader();
      let sent = 0;
      let chunkIndex = 0;
      let buffer = new Uint8Array(0);

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        // Accumulate into buffer
        const newBuffer = new Uint8Array(buffer.length + value.length);
        newBuffer.set(buffer);
        newBuffer.set(value, buffer.length);
        buffer = newBuffer;

        // Send complete chunks
        while (buffer.length >= CHUNK_SIZE) {
          const chunk = buffer.slice(0, CHUNK_SIZE);
          buffer = buffer.slice(CHUNK_SIZE);

          // Convert to base64
          const base64 = btoa(String.fromCharCode(...chunk));
          fileChannel.send(JSON.stringify({
            type: 'file-chunk',
            id: transferId,
            index: chunkIndex,
            data: base64
          }));

          chunkIndex++;
          sent += chunk.length;
          const pct = Math.round((sent / file.size) * 100);
          progressFill.style.width = pct + '%';
          progressPct.textContent = pct + '%';

          // Small delay to prevent flooding the channel
          await new Promise(r => setTimeout(r, 5));
        }
      }

      // Send remaining buffer
      if (buffer.length > 0) {
        const base64 = btoa(String.fromCharCode(...buffer));
        fileChannel.send(JSON.stringify({
          type: 'file-chunk',
          id: transferId,
          index: chunkIndex,
          data: base64
        }));
        sent += buffer.length;
      }

      // Send end
      fileChannel.send(JSON.stringify({ type: 'file-end', id: transferId }));
      progressFill.style.width = '100%';
      progressPct.textContent = '100% — Done!';
      setTimeout(() => progressEl.classList.remove('visible'), 3000);
    }

    // ─── File Transfer Events ───────────────────────────────────────
    window.onedesk.onFileTransferStarted((data) => {
      const progressEl = document.getElementById('fileProgress');
      document.getElementById('fileProgressName').textContent = `Receiving: ${data.name}`;
      document.getElementById('fileProgressFill').style.width = '0%';
      document.getElementById('fileProgressPct').textContent = '0%';
      progressEl.classList.add('visible');
    });

    window.onedesk.onFileTransferProgress((data) => {
      document.getElementById('fileProgressFill').style.width = data.progress + '%';
      document.getElementById('fileProgressPct').textContent = data.progress + '%';
    });

    window.onedesk.onFileReceived((data) => {
      document.getElementById('fileProgressFill').style.width = '100%';
      document.getElementById('fileProgressPct').textContent = `Saved to ${data.path}`;
      setTimeout(() => document.getElementById('fileProgress').classList.remove('visible'), 4000);
    });

    // ─── Stats ──────────────────────────────────────────────────────
    window.onedesk.onStatsUpdated((stats) => {
      if (!showStats) return;
      
      const rttEl = document.getElementById('statRTT');
      rttEl.textContent = stats.rtt + 'ms';
      rttEl.className = 'stat-value ' + (stats.rtt < 50 ? 'stat-good' : stats.rtt < 150 ? 'stat-warn' : 'stat-bad');

      document.getElementById('statFPS').textContent = stats.framesPerSecond || '—';
      
      const lossEl = document.getElementById('statLoss');
      lossEl.textContent = stats.packetLoss;
      lossEl.className = 'stat-value ' + (stats.packetLoss < 5 ? 'stat-good' : stats.packetLoss < 20 ? 'stat-warn' : 'stat-bad');
    });

    window.onedesk.onQualityChanged((data) => {
      document.getElementById('controlQuality').textContent = data.preset;
      document.getElementById('statQuality').textContent = data.preset;
    });

    // ─── Controls ───────────────────────────────────────────────────
    function toggleStats() {
      showStats = !showStats;
      document.getElementById('statsHUD').classList.toggle('visible', showStats);
      document.getElementById('btnStats').classList.toggle('active', showStats);
    }

    function toggleQualityMenu() {
      document.getElementById('qualityMenu').classList.toggle('visible');
    }

    function toggleAudio() {
      const video = document.getElementById('remoteVideo');
      const btn = document.getElementById('btnAudio');
      if (video.muted) {
        video.muted = false;
        btn.textContent = '🔊';
        btn.classList.add('active');
      } else {
        video.muted = true;
        btn.textContent = '🔇';
        btn.classList.remove('active');
      }
    }

    function setQuality(preset) {
      currentQuality = preset;
      window.onedesk.setQualityPreset(preset);
      document.getElementById('controlQuality').textContent = preset.charAt(0).toUpperCase() + preset.slice(1);
      
      // Update active state in menu
      document.querySelectorAll('.quality-option').forEach(el => {
        el.classList.toggle('active', el.dataset.preset === preset);
      });
      document.getElementById('qualityMenu').classList.remove('visible');
    }

    // Set default active
    document.querySelector('.quality-option[data-preset="auto"]').classList.add('active');

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    function disconnect() {
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      if (inputChannel) { inputChannel.close(); inputChannel = null; }
      if (clipboardChannel) { clipboardChannel.close(); clipboardChannel = null; }
      if (fileChannel) { fileChannel.close(); fileChannel = null; }
      window.close();
    }
  </script>
</body>
</html>
