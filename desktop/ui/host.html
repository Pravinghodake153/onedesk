<!DOCTYPE html>
<html>
<head><title>OneDesk Host Process</title></head>
<body>
  <!-- Hidden renderer — handles WebRTC hosting, screen capture,
       input forwarding to native simulator, clipboard sync,
       and file transfer DataChannels. Never shown to user. -->
  <script>
    const ICE_SERVERS = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' }
    ];

    const peers = new Map();     // socketId -> { pc, inputChannel, clipboardChannel, fileChannel }
    let screenStream = null;
    let micStream = null;
    let camStream = null;

    // ─── Screen Capture ─────────────────────────────────────────────
    async function getScreenStream() {
      if (screenStream && screenStream.active) {
        const tracks = screenStream.getVideoTracks();
        if (tracks.length > 0 && tracks[0].readyState === 'live') {
          return screenStream;
        }
      }

      // Stop any dead/ended tracks
      if (screenStream) {
        screenStream.getTracks().forEach(t => {
          try { t.stop(); } catch (e) {}
        });
        screenStream = null;
      }

      try {
        const sources = await window.onedesk.getScreenSources();
        if (sources.length === 0) {
          console.error('[Host] No screen sources available');
          return null;
        }

        const primarySource = sources[0];
        
        // Get quality constraints from main process
        const screenInfo = await window.onedesk.getScreenInfo();

        screenStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            mandatory: {
              chromeMediaSource: 'desktop',
              chromeMediaSourceId: primarySource.id,
              maxWidth: screenInfo.width || 1920,
              maxHeight: screenInfo.height || 1080,
              maxFrameRate: 30
            }
          }
        });

        // Monitor stream health
        const tracks = screenStream.getVideoTracks();
        if (tracks.length > 0) {
          tracks[0].onended = () => {
            console.warn('[Host] Screen capture track ended — will recapture on next connection');
            screenStream = null;
          };
        }

        console.log(`[Host] Screen capture started: ${screenInfo.width}x${screenInfo.height}`);
        return screenStream;
      } catch (err) {
        console.error('[Host] Failed to capture screen:', err);
        return null;
      }
    }

    // ─── Handle Incoming WebRTC Offer ───────────────────────────────
    async function handleOffer(data) {
      const { senderSocketId, offer, feature = 'screen' } = data;
      console.log(`[Host] Processing offer from ${senderSocketId} (${feature})`);

      // If this peer already had an active connection, clean it up first
      if (peers.has(senderSocketId)) {
        console.log(`[Host] Closing previous connection for ${senderSocketId} before switching to ${feature}`);
        cleanupPeer(senderSocketId);
      }

      // Stop opposing streams to release hardware and prevent device conflict
      if (feature === 'camera' || feature === 'av') {
        if (screenStream) {
          screenStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
          screenStream = null;
          console.log('[Host] Screen capture stopped for camera mode');
        }
      } else if (feature === 'screen') {
        if (camStream) {
          camStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
          camStream = null;
          console.log('[Host] Camera capture stopped (hardware released) for screen mode');
        }
      } else if (feature === 'mic') {
        if (screenStream) {
          screenStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
          screenStream = null;
        }
        if (camStream) {
          camStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
          camStream = null;
        }
      }

      // Capture requested streams
      const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
      let hasTracks = false;

      // Screen Capture (ONLY for screen feature)
      if (feature === 'screen') {
        const stream = await getScreenStream();
        if (stream) {
          stream.getTracks().forEach(track => pc.addTrack(track, stream));
          hasTracks = true;
        } else {
          console.error('[Host] Failed to attach screen stream');
        }
      }

      // Camera Capture (for camera or av)
      if (feature === 'camera' || feature === 'av') {
        try {
          const granted = await window.onedesk.requestMediaAccess('camera');
          if (granted) {
            let isLive = false;
            if (camStream && camStream.active) {
              const tracks = camStream.getVideoTracks();
              if (tracks.length > 0 && tracks[0].readyState === 'live') {
                isLive = true;
              }
            }
            if (!isLive) {
              if (camStream) {
                camStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
              }
              camStream = await navigator.mediaDevices.getUserMedia({ video: true });
            }
            camStream.getTracks().forEach(track => pc.addTrack(track, camStream));
            hasTracks = true;
            console.log('[Host] Camera capture attached');
          } else {
            console.error('[Host] Camera access denied by macOS');
          }
        } catch (err) {
          console.error('[Host] Failed to capture camera:', err);
        }
      }

      // Microphone Capture (only for mic or av features)
      if (feature === 'mic' || feature === 'av') {
        try {
          const granted = await window.onedesk.requestMediaAccess('microphone');
          if (granted) {
            let isLive = false;
            if (micStream && micStream.active) {
              const tracks = micStream.getAudioTracks();
              if (tracks.length > 0 && tracks[0].readyState === 'live') {
                isLive = true;
              }
            }
            if (!isLive) {
              if (micStream) {
                micStream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} });
              }
              micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            }
            micStream.getTracks().forEach(track => pc.addTrack(track, micStream));
            hasTracks = true;
            console.log('[Host] Microphone capture attached');
          } else {
            console.error('[Host] Microphone access denied by macOS');
          }
        } catch (err) {
          console.error('[Host] Failed to capture microphone:', err);
        }
      }

      if (!hasTracks) {
        console.error('[Host] Cannot accept offer — no media streams captured');
        return;
      }

      // ICE candidates
      pc.onicecandidate = (event) => {
        if (event.candidate) {
          window.onedesk.sendSignal('webrtc-ice-candidate', {
            targetSocketId: senderSocketId,
            candidate: event.candidate.toJSON()
          });
        }
      };

      // ─── Data Channels ──────────────────────────────────────────
      const peerData = {
        pc,
        inputChannel: null,
        clipboardChannel: null,
        fileChannel: null,
        heartbeatChannel: null,
        lastHeard: Date.now(),
        heartbeatTimer: null,
        watchdogTimer: null
      };

      pc.ondatachannel = (event) => {
        const channel = event.channel;
        console.log(`[Host] Data channel received: ${channel.label}`);

        switch (channel.label) {
          case 'heartbeat':
            peerData.heartbeatChannel = channel;
            peerData.lastHeard = Date.now();
            channel.onmessage = (msg) => {
              try {
                const data = JSON.parse(msg.data);
                if (data.type === 'pong' || data.type === 'listening') {
                  peerData.lastHeard = Date.now();
                } else if (data.type === 'stop-listening') {
                  console.log(`[Host] Client ${senderSocketId} explicitly stopped listening — shutting down stream`);
                  cleanupPeer(senderSocketId);
                }
              } catch (e) {}
            };
            break;

          case 'input':
            peerData.inputChannel = channel;
            channel.onmessage = (msg) => {
              try {
                peerData.lastHeard = Date.now();
                const inputEvent = JSON.parse(msg.data);
                // Forward to main process for native OS simulation
                window.onedesk.simulateInput(inputEvent);
              } catch (e) {
                console.error('[Host] Invalid input event:', e);
              }
            };
            break;

          case 'clipboard':
            peerData.clipboardChannel = channel;
            channel.onmessage = (msg) => {
              try {
                peerData.lastHeard = Date.now();
                const clipboardData = JSON.parse(msg.data);
                window.onedesk.writeClipboardFromRemote(clipboardData);
              } catch (e) {
                console.error('[Host] Invalid clipboard data:', e);
              }
            };
            break;

          case 'filetransfer':
            peerData.fileChannel = channel;
            channel.onmessage = (msg) => {
              try {
                peerData.lastHeard = Date.now();
                const fileMsg = JSON.parse(msg.data);
                window.onedesk.receiveFileMessage(fileMsg);
              } catch (e) {
                console.error('[Host] Invalid file transfer message:', e);
              }
            };
            break;
        }
      };

      // Active Streaming Listener Check (Ping/Pong Watchdog)
      peerData.heartbeatTimer = setInterval(() => {
        if (peerData.heartbeatChannel && peerData.heartbeatChannel.readyState === 'open') {
          try {
            peerData.heartbeatChannel.send(JSON.stringify({ type: 'ping', t: Date.now() }));
          } catch (e) {}
        }
      }, 1000);

      peerData.watchdogTimer = setInterval(() => {
        const silence = Date.now() - peerData.lastHeard;
        if (silence > 3500) {
          console.warn(`[Host Watchdog] Client ${senderSocketId} is no longer listening (${silence}ms silence) — stopping stream and releasing hardware!`);
          cleanupPeer(senderSocketId);
        }
      }, 1000);

      // Connection state management
      pc.onconnectionstatechange = () => {
        const state = pc.connectionState;
        console.log(`[Host] Peer ${senderSocketId} connectionState: ${state}`);
        if (state === 'disconnected' || state === 'failed' || state === 'closed') {
          cleanupPeer(senderSocketId);
        }
      };

      pc.oniceconnectionstatechange = () => {
        const state = pc.iceConnectionState;
        console.log(`[Host] Peer ${senderSocketId} iceConnectionState: ${state}`);
        if (state === 'disconnected' || state === 'failed' || state === 'closed') {
          cleanupPeer(senderSocketId);
        }
      };

      // Set remote description and create answer
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      // Send answer
      window.onedesk.sendSignal('webrtc-answer', {
        targetSocketId: senderSocketId,
        answer: {
          type: pc.localDescription.type,
          sdp: pc.localDescription.sdp
        }
      });

      peers.set(senderSocketId, peerData);
      console.log(`[Host] Answer sent to ${senderSocketId} — streaming ${feature}`);
    }

    // ─── Handle ICE Candidate ───────────────────────────────────────
    async function handleIceCandidate(data) {
      const { senderSocketId, candidate } = data;
      const peer = peers.get(senderSocketId);
      if (peer && peer.pc && candidate) {
        try {
          await peer.pc.addIceCandidate(new RTCIceCandidate(candidate));
        } catch (err) {
          console.warn('[Host] Failed to add ICE candidate:', err.message);
        }
      }
    }

    // ─── Clipboard Sync (Host → Clients) ────────────────────────────
    window.onedesk.onClipboardChanged((data) => {
      // Send local clipboard changes to all connected clients
      for (const [socketId, peer] of peers) {
        if (peer.clipboardChannel && peer.clipboardChannel.readyState === 'open') {
          peer.clipboardChannel.send(JSON.stringify(data));
        }
      }
    });

    // ─── Stream Cleanup & Hardware Release ──────────────────────────
    function cleanupAllStreams() {
      if (screenStream) {
        screenStream.getTracks().forEach(t => {
          try { t.stop(); } catch (e) {}
        });
        screenStream = null;
        console.log('[Host] Screen capture stopped');
      }
      if (micStream) {
        micStream.getTracks().forEach(t => {
          try { t.stop(); } catch (e) {}
        });
        micStream = null;
        console.log('[Host] Microphone capture stopped');
      }
      if (camStream) {
        camStream.getTracks().forEach(t => {
          try { t.stop(); } catch (e) {}
        });
        camStream = null;
        console.log('[Host] Camera capture stopped (hardware released)');
      }
    }

    function cleanupPeer(socketId) {
      const peer = peers.get(socketId);
      if (peer) {
        if (peer.heartbeatTimer) clearInterval(peer.heartbeatTimer);
        if (peer.watchdogTimer) clearInterval(peer.watchdogTimer);
        if (peer.heartbeatChannel) {
          try { peer.heartbeatChannel.close(); } catch (e) {}
        }
        if (peer.inputChannel) {
          try { peer.inputChannel.close(); } catch (e) {}
        }
        if (peer.clipboardChannel) {
          try { peer.clipboardChannel.close(); } catch (e) {}
        }
        if (peer.fileChannel) {
          try { peer.fileChannel.close(); } catch (e) {}
        }
        if (peer.pc) {
          try { peer.pc.close(); } catch (e) {}
        }
        peers.delete(socketId);
        console.log(`[Host] Cleaned up peer ${socketId}`);
      }

      // If no active connections remain, stop all media streams immediately
      if (peers.size === 0) {
        cleanupAllStreams();
        console.log('[Host] No active connections — all streams stopped and hardware released');
      }
    }

    // ─── Handle Explicit Disconnect from Web Client ────────────────
    function handleDisconnect(data) {
      const { senderSocketId } = data || {};
      console.log(`[Host] Explicit disconnect signal for ${senderSocketId}`);
      if (!senderSocketId || senderSocketId === 'all') {
        for (const [socketId] of peers) {
          cleanupPeer(socketId);
        }
        cleanupAllStreams();
      } else {
        cleanupPeer(senderSocketId);
      }
    }

    window.addEventListener('beforeunload', () => {
      cleanupAllStreams();
    });

    // ─── Listen for Signaling Events ────────────────────────────────
    window.onedesk.onWebRTCOffer(handleOffer);
    window.onedesk.onWebRTCIceCandidate(handleIceCandidate);
    window.onedesk.onHostIncomingOffer(handleOffer);
    window.onedesk.onHostIceCandidate(handleIceCandidate);
    window.onedesk.onWebRTCDisconnect(handleDisconnect);

    if (window.onedesk.onStreamHeartbeat) {
      window.onedesk.onStreamHeartbeat((data) => {
        const { senderSocketId } = data || {};
        const peer = peers.get(senderSocketId);
        if (peer) {
          peer.lastHeard = Date.now();
        }
      });
    }

    console.log('[Host] Host renderer ready — energy-saving mode active with streaming listener check');
  </script>
</body>
</html>
